<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #07101e;
      }

      body {
        color: #f7faff;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background:
          radial-gradient(circle at 16% 16%, rgba(10, 132, 255, 0.24), transparent 30%),
          radial-gradient(circle at 84% 82%, rgba(53, 229, 153, 0.20), transparent 30%),
          linear-gradient(135deg, #07101e 0%, #08121f 52%, #050a12 100%);
      }

      .noise {
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        opacity: 0.16;
        background-image:
          linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
        background-size: 54px 54px;
        mask-image: radial-gradient(circle at 50% 50%, black, transparent 82%);
      }

      .backplate {
        position: absolute;
        inset: 34px;
        z-index: 2;
        border: 1px solid rgba(120, 190, 255, 0.24);
        border-radius: 42px;
        background:
          linear-gradient(120deg, rgba(10,132,255,0.11), transparent 34%),
          linear-gradient(300deg, rgba(53,229,153,0.11), transparent 42%),
          rgba(7, 14, 25, 0.58);
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.05),
          0 46px 140px rgba(0, 0, 0, 0.46);
      }

      .headline {
        position: absolute;
        left: 106px;
        top: 68px;
        z-index: 6;
        display: flex;
        align-items: center;
        gap: 18px;
      }

      .brand-dot {
        width: 18px;
        height: 18px;
        border-radius: 999px;
        background: #35e599;
        box-shadow: 0 0 36px rgba(53, 229, 153, 0.80);
      }

      .headline-title {
        font-size: 38px;
        line-height: 1;
        font-weight: 900;
        letter-spacing: 0;
      }

      .headline-subtitle {
        margin-top: 8px;
        color: #a7b0be;
        font-size: 20px;
        font-weight: 700;
      }

      .main-shot {
        position: absolute;
        left: 88px;
        top: 150px;
        z-index: 4;
        width: 1160px;
        height: 866px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 28px;
        background: #0a101b;
        box-shadow:
          0 42px 110px rgba(0, 0, 0, 0.54),
          0 0 72px rgba(10, 132, 255, 0.18);
      }

      .window-bar {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 54px;
        padding: 0 22px;
        background: #1f1f20;
        color: #a7b0be;
        font-size: 18px;
        font-weight: 800;
      }

      .traffic-light {
        width: 14px;
        height: 14px;
        border-radius: 999px;
      }

      .traffic-light.red { background: #ff5f57; }
      .traffic-light.yellow { background: #febc2e; }
      .traffic-light.green { background: #28c840; }

      .window-title {
        margin-left: 8px;
      }

      .app-body {
        display: grid;
        gap: 18px;
        height: calc(100% - 54px);
        padding: 22px;
        background: linear-gradient(150deg, #172234, #10151f 62%, #0d1119);
      }

      .app-panel {
        border: 1px solid rgba(255, 255, 255, 0.13);
        border-radius: 24px;
        background: rgba(28, 29, 31, 0.94);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.025);
      }

      .app-summary {
        padding: 24px 28px;
      }

      .app-summary-row,
      .quota-heading,
      .quota-provider-row,
      .usage-heading,
      .main-quota-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .app-identity {
        display: flex;
        align-items: center;
        gap: 18px;
      }

      .app-icon {
        width: 68px;
        height: 68px;
        display: grid;
        place-items: center;
        border-radius: 18px;
        background: linear-gradient(145deg, #38a8ff, #0677ff 72%);
        box-shadow: 0 12px 34px rgba(10, 132, 255, 0.34);
        font-size: 30px;
        font-weight: 950;
      }

      .app-name {
        font-size: 29px;
        font-weight: 950;
      }

      .app-description {
        margin-top: 5px;
        color: #a7b0be;
        font-size: 16px;
        font-weight: 700;
      }

      .feature-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 22px;
      }

      .feature-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 9px 13px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.075);
        color: #d9dee7;
        font-size: 15px;
        font-weight: 800;
      }

      .feature-switch {
        width: 34px;
        height: 19px;
        padding: 3px;
        border-radius: 99px;
        background: #0a84ff;
      }

      .feature-switch::after {
        display: block;
        width: 13px;
        height: 13px;
        margin-left: 15px;
        border-radius: 99px;
        background: #dcecff;
        content: "";
      }

      .summary-copy {
        margin-left: auto;
        color: #a7b0be;
        font-size: 14px;
        font-weight: 750;
      }

      .quota-panel {
        padding: 20px 28px 24px;
      }

      .panel-title {
        font-size: 22px;
        font-weight: 950;
      }

      .panel-meta {
        color: #8f98a6;
        font-size: 14px;
        font-weight: 750;
      }

      .quota-provider-row {
        margin-top: 20px;
      }

      .provider-pill {
        padding: 8px 17px;
        border-radius: 999px;
        background: #075da9;
        font-size: 17px;
        font-weight: 900;
      }

      .main-quota-row {
        margin-top: 22px;
        font-size: 21px;
        font-weight: 900;
      }

      .main-quota-value {
        color: #35e599;
        font-size: 24px;
      }

      .main-quota-bar {
        height: 10px;
        margin-top: 12px;
        overflow: hidden;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.14);
      }

      .main-quota-fill {
        width: 72%;
        height: 100%;
        border-radius: inherit;
        background: #35e599;
        box-shadow: 0 0 20px rgba(53, 229, 153, 0.48);
      }

      .usage-panel {
        min-height: 0;
        padding: 20px 28px 24px;
      }

      .usage-tabs {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px;
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.32);
      }

      .usage-tab {
        padding: 6px 12px;
        border-radius: 7px;
        color: #a7b0be;
        font-size: 14px;
        font-weight: 850;
      }

      .usage-tab.active {
        background: #075da9;
        color: white;
      }

      .usage-chart {
        display: flex;
        align-items: end;
        gap: 16px;
        height: 112px;
        margin-top: 18px;
        padding: 14px 18px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.16);
        background: repeating-linear-gradient(to top, transparent 0 35px, rgba(255,255,255,0.07) 36px);
      }

      .usage-bar {
        width: 24px;
        border-radius: 6px 6px 0 0;
        background: linear-gradient(#38a8ff, #087eff);
      }

      .usage-note {
        margin-top: 12px;
        color: #8f98a6;
        font-size: 13px;
        font-weight: 700;
      }

      .side-stack {
        position: absolute;
        right: 88px;
        top: 150px;
        z-index: 5;
        width: 520px;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      .notch-card,
      .menu-card,
      .widget-card {
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 28px;
        background: rgba(17, 25, 35, 0.92);
        box-shadow:
          0 32px 90px rgba(0, 0, 0, 0.46),
          inset 0 0 0 1px rgba(255, 255, 255, 0.05);
      }

      .notch-card {
        height: 172px;
        padding: 24px 26px;
      }

      .notch-label {
        color: #a7b0be;
        font-size: 17px;
        font-weight: 800;
      }

      .notch-shell {
        position: relative;
        width: 100%;
        height: 104px;
        margin-top: 12px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.10);
        border-radius: 18px 18px 34px 34px;
        background: #020305;
        box-shadow:
          inset 0 -1px 0 rgba(255, 255, 255, 0.08),
          0 18px 40px rgba(0, 0, 0, 0.42);
      }

      .notch-content {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 76px;
        padding: 0 24px;
      }

      .notch-provider,
      .notch-quota {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 21px;
        font-weight: 900;
      }

      .notch-quota {
        color: #35e599;
      }

      .notch-progress {
        height: 6px;
        margin: 0 24px;
        overflow: hidden;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.14);
      }

      .notch-progress-fill {
        width: 72%;
        height: 100%;
        border-radius: inherit;
        background: #35e599;
        box-shadow: 0 0 18px rgba(53, 229, 153, 0.64);
        transform-origin: left center;
      }

      .menu-card {
        height: 210px;
        padding: 28px 30px;
      }

      .card-label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
      }

      .card-kicker {
        color: #a7b0be;
        font-size: 18px;
        font-weight: 800;
      }

      .card-title {
        margin-top: 8px;
        font-size: 34px;
        line-height: 1;
        font-weight: 950;
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 9px 14px;
        border-radius: 999px;
        background: rgba(53, 229, 153, 0.13);
        color: #35e599;
        font-size: 18px;
        font-weight: 900;
      }

      .status-dot {
        width: 9px;
        height: 9px;
        border-radius: 99px;
        background: #35e599;
      }

      .metric {
        margin-top: 22px;
      }

      .metric-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: #f7faff;
        font-size: 24px;
        font-weight: 900;
      }

      .bar {
        margin-top: 10px;
        height: 12px;
        overflow: hidden;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.13);
      }

      .bar-fill {
        height: 100%;
        border-radius: inherit;
        transform-origin: left center;
      }

      .bar-fill.green {
        width: 72%;
        background: #35e599;
        box-shadow: 0 0 24px rgba(53, 229, 153, 0.52);
      }

      .widget-card {
        height: 396px;
        padding: 16px;
      }

      .widget-card img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: contain;
        border-radius: 20px;
        background: rgba(0, 0, 0, 0.28);
      }

      .sweep {
        position: absolute;
        top: 60px;
        bottom: 60px;
        z-index: 7;
        width: 170px;
        pointer-events: none;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.16), rgba(72, 208, 245, 0.28), transparent);
        filter: blur(3px);
        transform: skewX(-16deg);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="6"
      data-width="1920"
      data-height="1080"
    >
      <div class="noise" data-layout-ignore></div>
      <div class="backplate"></div>
      <div class="sweep"></div>

      <div class="headline">
        <div class="brand-dot"></div>
        <div>
          <div class="headline-title">ReadyCheck</div>
          <div class="headline-subtitle">Codex 配额状态与刷新控制</div>
        </div>
      </div>

      <div class="main-shot">
        <div class="window-bar">
          <span class="traffic-light red"></span>
          <span class="traffic-light yellow"></span>
          <span class="traffic-light green"></span>
          <span class="window-title">ReadyCheck</span>
        </div>
        <div class="app-body">
          <div class="app-panel app-summary">
            <div class="app-summary-row">
              <div class="app-identity">
                <div class="app-icon">RC</div>
                <div>
                  <div class="app-name">ReadyCheck</div>
                  <div class="app-description">Codex 配额状态与刷新控制</div>
                </div>
              </div>
              <div class="status-pill"><span class="status-dot"></span>已连接</div>
            </div>
            <div class="feature-row">
              <div class="feature-chip">显示 widget <span class="feature-switch"></span></div>
              <div class="feature-chip">置顶 widget <span class="feature-switch"></span></div>
              <div class="feature-chip">刘海状态 <span class="feature-switch"></span></div>
              <div class="summary-copy">每 1 分钟安全刷新</div>
            </div>
          </div>

          <div class="app-panel quota-panel">
            <div class="quota-heading">
              <div class="panel-title">额度</div>
              <div class="panel-meta">刚刚刷新</div>
            </div>
            <div class="quota-provider-row">
              <div class="provider-pill">Codex</div>
              <div class="status-pill"><span class="status-dot"></span>可用</div>
            </div>
            <div class="main-quota-row">
              <span>7 天额度</span>
              <span class="main-quota-value">72%</span>
            </div>
            <div class="main-quota-bar"><div class="main-quota-fill"></div></div>
          </div>

          <div class="app-panel usage-panel">
            <div class="usage-heading">
              <div>
                <div class="panel-title">近期额度消耗</div>
                <div class="panel-meta" style="margin-top: 5px">本地记录 · 单位为百分点</div>
              </div>
              <div class="usage-tabs">
                <span class="usage-tab active">24 小时</span>
                <span class="usage-tab">7 天</span>
                <span class="usage-tab">30 天</span>
              </div>
            </div>
            <div class="usage-chart">
              <span class="usage-bar" style="height: 28px"></span>
              <span class="usage-bar" style="height: 52px"></span>
              <span class="usage-bar" style="height: 34px"></span>
              <span class="usage-bar" style="height: 76px"></span>
              <span class="usage-bar" style="height: 46px"></span>
              <span class="usage-bar" style="height: 88px"></span>
              <span class="usage-bar" style="height: 62px"></span>
            </div>
            <div class="usage-note">只记录成功刷新之间的额度下降，不代表 Token 数量。</div>
          </div>
        </div>
      </div>

      <div class="side-stack">
        <div class="notch-card">
          <div class="notch-label">macOS 刘海实时状态</div>
          <div class="notch-shell">
            <div class="notch-content">
              <div class="notch-provider"><span class="status-dot"></span><span>Codex</span></div>
              <div class="notch-quota"><span>7 天</span><span>72%</span></div>
            </div>
            <div class="notch-progress"><div class="notch-progress-fill"></div></div>
          </div>
        </div>

        <div class="menu-card">
          <div class="card-label">
            <div>
              <div class="card-kicker">菜单栏速览</div>
              <div class="card-title">ReadyCheck</div>
            </div>
            <div class="status-pill"><span class="status-dot"></span>自动刷新</div>
          </div>
          <div class="metric">
            <div class="metric-row"><span>7 天额度</span><span>72%</span></div>
            <div class="bar"><div class="bar-fill green"></div></div>
          </div>
        </div>

        <div class="widget-card">
          <img src="assets/readycheck-widget.png" alt="ReadyCheck 桌面 widget 截图" />
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.fromTo(".sweep", { x: -260, opacity: 0 }, { x: 2020, opacity: 0.85, duration: 1.2, ease: "power2.inOut" }, 0.35);
      tl.to(".sweep", { opacity: 0, duration: 0.18 }, 1.58);

      tl.to(".main-shot", { y: -8, duration: 1.8, repeat: 2, yoyo: true, ease: "sine.inOut" }, 0.35);
      tl.to(".notch-card", { y: -6, duration: 1.7, repeat: 2, yoyo: true, ease: "sine.inOut" }, 0.22);
      tl.fromTo(".notch-progress-fill", { scaleX: 0.72 }, { scaleX: 1, duration: 1.1, ease: "power2.out" }, 0.28);
      tl.to(".notch-quota", { opacity: 0.72, duration: 0.75, repeat: 5, yoyo: true, ease: "sine.inOut" }, 0.32);
      tl.to(".menu-card", { y: 7, duration: 1.6, repeat: 2, yoyo: true, ease: "sine.inOut" }, 0.28);
      tl.to(".widget-card", { y: -10, duration: 1.75, repeat: 2, yoyo: true, ease: "sine.inOut" }, 0.34);
      tl.to(".brand-dot", { scale: 1.28, opacity: 0.72, duration: 0.8, repeat: 4, yoyo: true, ease: "sine.inOut" }, 0.2);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
