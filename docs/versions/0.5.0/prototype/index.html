<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ReadyCheck · 0.5.0 design preview</title><link rel="stylesheet" href="style.css"></head>
<body><div class="preview"><span>ReadyCheck <b>0.5.0</b> <span data-t="preview"></span></span><div><button id="reminders" class="tab" data-t="reminders"></button><button id="status" class="tab" data-t="data"></button><button id="language">EN</button></div></div>
<main><div class="chrome"><i></i><i></i><i></i><span>ReadyCheck</span></div><div class="body">
<header><div><p class="eyebrow" data-t="breadcrumb"></p><h1 data-t="reminders"></h1><p class="muted" data-t="intro"></p></div><button id="data-button" data-t="data"></button></header>
<section class="settings"><h2 data-t="quota"></h2><div class="row"><div><h3 data-t="low"></h3><p data-t="lowHelp"></p></div><select aria-label="Low quota threshold" id="low"><option value="0" data-t="off"></option><option>5%</option><option selected>10%</option><option>20%</option></select></div><div class="row"><div><h3 data-t="recovery"></h3><p data-t="recoveryHelp"></p></div><input id="recovery" type="checkbox" class="switch" checked aria-label="Quota recovery reminder"></div></section>
<section class="settings featured"><div class="row no-border"><div><h2 data-t="expiry"></h2><p data-t="expiryHelp"></p></div><input id="expiry" type="checkbox" class="switch" checked aria-label="Reset-card expiry reminder"></div><fieldset id="nodes"><legend data-t="nodes"></legend><div class="choices"><label><input type="checkbox" value="72" checked>72 <span data-t="hours"></span></label><label><input type="checkbox" value="48" checked>48 <span data-t="hours"></span></label><label><input type="checkbox" value="24" checked>24 <span data-t="hours"></span></label><label><input type="checkbox" value="12" checked>12 <span data-t="hours"></span></label></div></fieldset><p id="rule" class="note"></p><p id="save-status" class="feedback" role="status"></p><div class="row auto"><div><h3 data-t="auto"></h3><p data-t="autoHelp"></p></div><input id="auto" type="checkbox" class="switch" aria-label="Automatic card use"></div><div class="footnote"><span class="check">✓</span><p data-t="success"></p></div></section>
<section class="settings"><div class="row no-border"><div><h2 data-t="delivery"></h2><p data-t="deliveryHelp"></p></div><span class="badge" data-t="allowed"></span></div><div class="actions"><button id="test" data-t="test"></button><button id="history" data-t="history"></button><button id="system" data-t="system"></button></div><p id="delivery-result" class="feedback" role="status"></p></section>
<p class="scope" data-t="scope"></p></div></main>
<div class="demo"><label><input id="failure" type="checkbox"><span data-t="simulateFailure"></span></label><span data-t="simulation"></span></div>
<dialog id="data-dialog"><header><div><p class="eyebrow" data-t="connection"></p><h1 data-t="data"></h1></div><button class="close" aria-label="Close" data-close>×</button></header><label class="scenario"><span data-t="scenario"></span><select id="scenario"></select></label><div id="status-content"></div><div class="actions"><button class="primary" id="retry"></button><button data-close data-t="close"></button></div><p id="retry-result" class="feedback" role="status"></p></dialog>
<dialog id="auto-dialog"><h1 data-t="confirm"></h1><p data-t="confirmHelp"></p><div class="actions"><button class="primary" id="confirm-auto" data-t="enable"></button><button data-close data-t="cancel"></button></div></dialog>
<dialog id="history-dialog"><header><h1 data-t="history"></h1><button data-close class="close" aria-label="Close">×</button></header><p class="muted" data-t="historyHelp"></p><div class="history-row"><span data-t="exampleExpiry"></span><span class="badge" data-t="accepted"></span></div><p class="muted" data-t="acceptedHelp"></p><button data-close data-t="close"></button></dialog>
<script src="app.js"></script></body></html>
